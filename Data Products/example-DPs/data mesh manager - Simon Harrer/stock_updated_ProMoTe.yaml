ontology:
  name: StockUpdatedDataProduct
  base: https://github.com/Stefan-Driessen/ProMoTe#
  prefixes:
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    dct: http://purl.org/dc/terms/
    dcat: http://www.w3.org/ns/dcat#
  annotations: []

  individuals:
    - name: StockUpdatedDataProduct
      type:
        - class-data-product
      identifier: "stock_updated"
      title: "Stock Updates"
      description: "Raw event data from stock_updated confluent kafka topic."
      property_data_provider: FulfillmentTeam
      keywords:
        - "kafka"
        - "confluent"
        - "athena"
        - "glue"
        - "s3"

    - name: FulfillmentTeam
      type:
        - http://www.w3.org/ns/prov#Agent
      label: "Fulfillment Team"

    - name: FulfillmentDomain
      type:
        - class-domain
      label: "Fulfillment Domain"

    - name: KafkaInputPort
      type:
        - class-input-port
      identifier: "kafka_stock_topic"
      title: "Kafka Stock Topic"
      description: "Kafka Topic with Stock updates"
      resource_property_source_system: StockService

    - name: StockService
      type:
        - owl:NamedIndividual
      label: "Stock Service"
      identifier: "stock-service"

    - name: GlueCatalogOutputPort
      type:
        - class-output-port
      identifier: "glue_catalog_database_stock_updated_v1"
      title: "Glue Catalog Database: Stock Updates (v1)"
      description: "All stock updates represented as a Glue Catalog table"
      property_exposes_data_product: StockUpdatedDataProduct
      property_data_contract: GlueCatalogDataContract
      endpointURI: "arn:aws:glue:eu-central-1:528115139298:table/fulfillment-stock-updated/stock_updated"

    - name: S3OutputPort
      type:
        - class-output-port
      identifier: "s3_bucket_stock_updated_v1"
      title: "S3 Bucket: Stock Updates (v1)"
      description: "All stock updates represented as a S3 bucket"
      property_exposes_data_product: StockUpdatedDataProduct
      property_data_contract: S3DataContract
      endpointURI: "arn:aws:s3:::fulfillment-stock-updated"

    - name: GlueCatalogDataContract
      type:
        - class-data-contract
      identifier: "glue_catalog_data_contract"
      applies_to_port: GlueCatalogOutputPort
      provider_promise: "The data will be available with 99.9% uptime"

    - name: S3DataContract
      type:
        - class-data-contract
      identifier: "s3_data_contract"
      applies_to_port: S3OutputPort
      provider_promise: "The data will be updated daily"