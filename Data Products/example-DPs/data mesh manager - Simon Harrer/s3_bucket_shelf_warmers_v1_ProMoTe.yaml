ontology:
  name: S3BucketShelfWarmers
  base: https://github.com/Stefan-Driessen/ProMoTe#
  prefixes:
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    dct: http://purl.org/dc/terms/
  annotations: []

  individuals:
    - name: S3Distribution
      type:
        - class-distribution
      identifier: "s3_bucket_shelf_warmers_v1"
      title: "S3 Bucket: Shelf Warmers (v1)"
      description: "All Shelf Warmers represented as a S3 bucket with JSON files"
      distribution_property_output_port: S3OutputPort
      property_physical_schema: ShelfWarmersJSONSchema

    - name: ShelfWarmersJSONSchema
      type:
        - owl:NamedIndividual
      description: "JSON schema for shelf warmers data"
      comment: |
        [ {
          "$id" : "https://example.com/fulfillment-stock-updated.schema.json",
          "$schema" : "http://json-schema.org/draft-07/schema#",
          "title" : "fulfillment-shelf-warmers",
          "type" : "object",
          "properties" : {
            "sku" : {
              "description" : "Stock Keeping Unit",
              "type" : "string"
            },
            "location" : {
              "description" : "The location (e.g. store) of the shelf warmers",
              "type" : "string"
            },
            "available" : {
              "description" : "Number of available shelf warmers in the specified location",
              "type" : "integer"
            },
            "updated_at" : {
              "description" : "Timestamp where this information were created",
              "type" : "string",
              "format" : "date-time"
            }
          }
        } ]

    - name: ShelfWarmersDataAsset
      type:
        - class-dataset
      identifier: "shelf_warmers_dataset"
      title: "Shelf Warmers Dataset"
      description: "Dataset containing shelf warmers information"
      property_offered_in_data_product: ShelfWarmersDataProduct

    - name: ShelfWarmersDataProduct
      type:
        - class-data-product
      identifier: "shelf_warmers"
      title: "Shelf Warmers"

    - name: S3OutputPort
      type:
        - class-output-port
      identifier: "s3_bucket_shelf_warmers_v1"
      title: "S3 Bucket: Shelf Warmers (v1)"