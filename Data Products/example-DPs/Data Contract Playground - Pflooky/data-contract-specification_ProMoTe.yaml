ontology:
  name: CovidCasesDataContract
  base: https://github.com/Stefan-Driessen/ProMoTe#
  prefixes:
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    dct: http://purl.org/dc/terms/
    dcat: http://www.w3.org/ns/dcat#
  annotations: []

  individuals:
    - name: CovidCasesDataContract
      type:
        - class-data-contract
      identifier: "covid_cases"
      title: "COVID-19 cases"
      description: "Johns Hopkins University Consolidated data on COVID-19 cases, sourced from Enigma"
      applies_to_port: S3JsonOutputPort
      provider_promise: "Data is updated daily"
      data_contract_property_policy: DataFreshnessPolicy

    - name: DataFreshnessPolicy
      type:
        - owl:NamedIndividual
      label: "Data Freshness Policy"
      comment: "freshness(last_update::datetime) < 5000d - dataset is not updated anymore"

    - name: DataVolumePolicy
      type:
        - owl:NamedIndividual
      label: "Data Volume Policy"
      comment: "row_count > 1000"

    - name: S3JsonOutputPort
      type:
        - class-output-port
      identifier: "s3-json"
      title: "S3 JSON Output Port"
      description: "S3 bucket containing COVID-19 case data in JSON format"
      endpointURI: "s3://covid19-lake/enigma-jhu/json/*.json"
      consume_instructions: "Data can be accessed through S3 using AWS CLI or SDK"

    - name: CovidCasesDistribution
      type:
        - class-distribution
      identifier: "covid_cases_json"
      title: "COVID-19 Cases JSON"
      description: "COVID-19 cases dataset in JSON format"
      distribution_property_output_port: S3JsonOutputPort
      property_physical_schema: CovidCasesSchema

    - name: CovidCasesSchema
      type:
        - owl:NamedIndividual
      label: "COVID-19 Cases Schema"
      comment: |
        Fields:
          - fips: state and county two digits code (string)
          - admin2: county name (string)
          - province_state: province name or state name (string)
          - country_region: country name or region name (string)
          - last_update: last update timestamp (timestamp_ntz)
          - latitude: location latitude (double)
          - longitude: location longitude (double)
          - confirmed: number of confirmed cases (int)
          - combined_key: county name+state name+country name (string)

    - name: CovidCasesDataset
      type:
        - class-dataset
      identifier: "covid_cases_dataset"
      title: "COVID-19 Cases Dataset"
      description: "The number of confirmed covid cases reported for a specified region, with location and county/province/country information"
      dataset_property_logical_schema: CovidCasesSchema
      property_offered_in_data_product: CovidCasesDataProduct

    - name: CovidCasesDataProduct
      type:
        - class-data-product
      identifier: "covid_cases_data_product"
      title: "COVID-19 Cases Data Product"
      description: "Data product containing COVID-19 case information from Johns Hopkins University"
      property_dataset: CovidCasesDataset
      data_product_property_output_port: S3JsonOutputPort