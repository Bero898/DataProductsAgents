ontology:
  name: ShelfWarmersDataProduct
  base: https://github.com/Stefan-Driessen/ProMoTe#
  prefixes:
    rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
    rdfs: http://www.w3.org/2000/01/rdf-schema#
    dct: http://purl.org/dc/terms/
    dcat: http://www.w3.org/ns/dcat#
  annotations: []

  individuals:
    - name: ShelfWarmersDataProduct
      type:
        - class-data-product
      identifier: "shelf_warmers"
      title: "Shelf Warmers"
      description: "Calculated shelfwarmers. Read about calculation in docs."
      data_provider: FulfillmentTeam
      keywords:
        - "athena"
        - "glue"
        - "s3"
      estimated_value: "Critically important for fulfillment operations"

    - name: FulfillmentTeam
      type:
        - http://www.w3.org/ns/prov#Agent
      label: "Fulfillment Team"

    - name: FulfillmentDomain
      type:
        - class-domain
      label: "Fulfillment Domain"

    - name: ShelfWarmersDataset
      type:
        - class-dataset
      identifier: "shelf_warmers_dataset"
      title: "Shelf Warmers Dataset"
      description: "Core dataset containing shelf warmers information"
      offered_in_data_product: ShelfWarmersDataProduct
      source_system: FulfillmentSystem

    - name: FulfillmentSystem
      type:
        - owl:NamedIndividual
      label: "Fulfillment System"

    - name: GlueCatalogOutputPort
      type:
        - class-output-port
      identifier: "glue_catalog_database_shelf_warmers_v1"
      title: "Glue Catalog Database: Shelf Warmers (v1)"
      description: "All Shelf Warmers represented as a Glue Catalog table"
      exposes_data_product: ShelfWarmersDataProduct
      data_contract: GlueCatalogDataContract
      endpointURI: "arn:aws:glue:eu-central-1:528115139298:table/fulfillment-shelf-warmers/shelf_warmers"
      access_management: GlueAccessManagement

    - name: S3OutputPort
      type:
        - class-output-port
      identifier: "s3_bucket_shelf_warmers_v1"
      title: "S3 Bucket: Shelf Warmers (v1)"
      description: "All Shelf Warmers represented as a Glue Catalog table"
      exposes_data_product: ShelfWarmersDataProduct
      data_contract: S3DataContract
      endpointURI: "arn:aws:s3:::fulfillment-shelf-warmers"
      access_management: S3AccessManagement

    - name: GlueAccessManagement
      type:
        - owl:NamedIndividual
      label: "Glue Access Management"
      comment: "Access managed through AWS IAM roles and policies"

    - name: S3AccessManagement
      type:
        - owl:NamedIndividual
      label: "S3 Access Management"
      comment: "Access managed through AWS IAM roles and bucket policies"

    - name: GlueCatalogDataContract
      type:
        - class-data-contract
      identifier: "glue_catalog_data_contract"
      applies_to_port: GlueCatalogOutputPort
      provider_promise: "The data will be available with 99.9% uptime"

    - name: S3DataContract
      type:
        - class-data-contract
      identifier: "s3_data_contract"
      applies_to_port: S3OutputPort
      provider_promise: "The data will be updated daily"

    - name: ShelfWarmersDataProductCatalogRecord
      type:
        - http://www.w3.org/ns/dcat#CatalogRecord
      primary_topic: ShelfWarmersDataProduct
      title: "Shelf Warmers Data Product Catalog Record"
      description: "Catalog record for the Shelf Warmers data product"